name: Publicar en Surge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: surge-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Construir el sitio
        run: python3 build.py

      - name: Comprobar secreto de Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::error::Falta el secreto SURGE_TOKEN en Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Publicar en Surge
        run: npx surge ./dist lienzo.surge.sh --token "$SURGE_TOKEN"
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
